name: Upload Spark Home Audio 0.2.19 release assets
on:
  push:
    branches: [codex/publish-audio-v0.2.19]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and upload the release assets
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sha256sum -c SHA256SUMS
          gh release upload v0.2.19 *.spk SHA256SUMS manifest.json manifest.sig SparkHomeAudio.apk android-update.json --repo "$GITHUB_REPOSITORY"
