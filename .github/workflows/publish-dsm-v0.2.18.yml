name: Upload Spark Home Audio 0.2.18 DSM assets
on:
  push:
    branches: [codex/publish-dsm-v0.2.18]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and upload the DSM assets
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sha256sum -c SHA256SUMS
          gh release upload v0.2.18 *.spk SHA256SUMS manifest.json manifest.sig SparkHomeAudio.apk android-update.json --repo "$GITHUB_REPOSITORY"
